name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Sync plugin version with tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          sed -i "s/new Version([0-9, ]*)/new Version(${VERSION//./, })/" TianSuo.TShock/TianSuoPlugin.cs
          grep -n "Version" TianSuo.TShock/TianSuoPlugin.cs | head -3

      - name: Restore
        run: dotnet restore TianSuo.sln

      - name: Build
        run: dotnet build TianSuo.sln -c Release --no-restore

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p release
          cp TianSuo.TShock/bin/Release/net6.0/TianSuo.TShock.dll release/
          cp TianSuo.TShock/bin/Release/net6.0/TianSuo.Tool.dll release/
          cp README.md release/
          cp LICENSE release/

      - name: Create archive
        shell: bash
        run: |
          cd release
          zip -r "../TianSuo-${GITHUB_REF_NAME}.zip" .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## TianSuo ${{ github.ref_name }}

            将插件复制到服务器的 `ServerPlugins` 目录即可安装
          files: |
            release/TianSuo.TShock.dll
            release/TianSuo.Tool.dll
            TianSuo-${{ github.ref_name }}.zip
